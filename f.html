<meta charset="utf-8">

<title>關西九日行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F2F4; --card:#FFFFFF; --ink:#1C2333; --muted:#646B7A; --rule:#D6D9E0;
  --indigo:#2B3A67; --rail:#3A55A8; --bus:#2F7A55; --walk:#8A909C; --taxi:#B8720E; --air:#7A6AA8;
  --warn:#A8650A; --warn-bg:#FBEFD9; --todo-bg:#E8ECF7; --done:#2F7A55;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151D; --card:#1A202B; --ink:#E5E8EF; --muted:#9AA1B0; --rule:#2D3443;
    --indigo:#A9B9EE; --rail:#7D98E6; --bus:#62C292; --walk:#7C8394; --taxi:#E5A84E; --air:#B3A5E0;
    --warn:#E5A84E; --warn-bg:#2E2414; --todo-bg:#1F2740; --done:#62C292; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151D; --card:#1A202B; --ink:#E5E8EF; --muted:#9AA1B0; --rule:#2D3443;
  --indigo:#A9B9EE; --rail:#7D98E6; --bus:#62C292; --walk:#7C8394; --taxi:#E5A84E; --air:#B3A5E0;
  --warn:#E5A84E; --warn-bg:#2E2414; --todo-bg:#1F2740; --done:#62C292; color-scheme:dark;
}
html,body{height:100%;}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;font-size:16px;line-height:1.65;}
a{color:var(--indigo);text-underline-offset:3px;}
button{font:inherit;color:inherit;}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:6px;}
.wrap{max-width:640px;margin:0 auto;padding:0 16px;}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);}
.top .bar{display:flex;align-items:center;justify-content:space-between;padding-top:10px;}
.top h1{font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;font-size:1.15rem;margin:0;}
.top .today{font-size:.82rem;color:var(--muted);}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--rule);
  border-radius:12px;padding:6px 12px;text-align:center;line-height:1.2;min-width:58px;}
.tabs a b{display:block;font-size:.95rem;}
.tabs a small{font-size:.74rem;color:var(--muted);}
.tabs a[aria-current="page"]{background:var(--indigo);border-color:var(--indigo);color:var(--paper);}
.tabs a[aria-current="page"] small{color:var(--paper);opacity:.8;}
.tabs a.is-today b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--taxi);margin-left:4px;vertical-align:middle;}

.view{padding-top:22px;padding-bottom:60px;}
.day-head{margin-bottom:16px;}
.day-head .date{color:var(--muted);font-size:.92rem;}
.day-head h2{font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;font-size:clamp(1.7rem,7vw,2.2rem);line-height:1.2;margin:2px 0 0;}
.day-head .links{margin-top:6px;font-size:.9rem;display:flex;gap:14px;flex-wrap:wrap;}

.hotel{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin:0 0 18px;}
.hotel .lbl{font-size:.8rem;color:var(--muted);}
.hotel .name{font-weight:700;}
.hotel .addr{font-size:.92rem;margin-top:2px;word-break:break-all;}
.hotel .addr.missing{color:var(--warn);}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:10px;
  border:1px solid var(--rule);background:var(--paper);text-decoration:none;color:var(--ink);font-size:.9rem;font-weight:500;cursor:pointer;}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:var(--paper);}

ol.line{list-style:none;margin:0;padding:0;}
ol.line > li{position:relative;padding-left:30px;}
ol.line > li::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--rule);}
ol.line > li:first-child::before{top:14px;}
ol.line > li:last-child::before{bottom:calc(100% - 14px);}

li.stop{padding:5px 0;}
li.stop::after{content:"";position:absolute;left:4px;top:11px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--ink);}
li.stop.minor::after{left:7px;top:14px;width:8px;height:8px;border-width:2px;border-color:var(--muted);}
li.stop .t{font-variant-numeric:tabular-nums;font-weight:700;margin-right:8px;}
li.stop .n{font-weight:700;}
li.stop.minor .n{font-weight:400;}
li.stop .sub{display:block;font-size:.88rem;color:var(--muted);}

li.leg{padding:6px 0 10px;}
li.leg::before{width:6px !important;left:8px !important;border-radius:3px;background:var(--m) !important;}
li.leg.walk::before{background:repeating-linear-gradient(var(--walk) 0 6px,transparent 6px 11px) !important;}
.leg-card{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--m);border-radius:12px;padding:12px 14px;}
.mode{display:inline-block;font-size:.75rem;font-weight:700;color:var(--m);margin-bottom:2px;}
.leg-route{font-weight:700;line-height:1.4;}
.leg-via{font-size:.88rem;color:var(--muted);}
.leg-meta{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:.92rem;margin-top:6px;font-variant-numeric:tabular-nums;}
.leg-meta span{color:var(--muted);}
.leg-meta b{color:var(--ink);font-weight:700;}
.steps{margin:8px 0 0;padding-left:1.2em;font-size:.9rem;}
.steps li{margin:2px 0;}
.warn{margin:8px 0 0;font-size:.88rem;background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:6px 10px;}
.warn::before{content:"注意　";color:var(--warn);font-weight:700;}
.leg-card .btns{margin-top:10px;}

li.todo{padding:6px 0;}
li.todo::after{content:"";position:absolute;left:5px;top:16px;width:12px;height:12px;border-radius:3px;background:var(--taxi);transform:rotate(45deg);}
label.check{display:flex;gap:10px;align-items:flex-start;background:var(--todo-bg);border-radius:12px;padding:10px 12px;cursor:pointer;}
label.check input{width:22px;height:22px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--done);}
label.check span{font-size:.94rem;font-weight:500;}
label.check span em{display:block;font-style:normal;font-weight:400;font-size:.85rem;color:var(--muted);}
label.check.hl{outline:2px solid var(--taxi);}
label.check:has(input:checked) span{color:var(--muted);text-decoration:line-through;}

.stay-list .hotel{margin-bottom:12px;}
.stay-list .nights{font-size:.85rem;color:var(--muted);}
.pager{display:flex;justify-content:space-between;margin-top:28px;gap:10px;}
.pager a{flex:1;text-align:center;}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:8px 16px;border-radius:999px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;}
.toast.show{opacity:1;}
:root{--food:#B24A3A;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--food:#EE8574;}}
:root[data-theme="dark"]{--food:#EE8574;}
li.food{padding:6px 0;}
li.food::after{content:"";position:absolute;left:5px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--food);}
.food-card{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--food);border-radius:12px;padding:10px 14px;}
.food-kind{font-size:.75rem;font-weight:700;color:var(--food);}
.food-name{font-weight:700;line-height:1.35;}
.food-jp{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:8px;}
.food-dish{margin:4px 0 0;font-size:.92rem;}
.food-dish::before{content:"點這個　";color:var(--food);font-weight:700;}
.food-why{margin:2px 0 0;font-size:.88rem;color:var(--muted);}
.food-card .btns{margin-top:8px;}
.food-card .btn{min-height:36px;padding:4px 12px;}
footer{color:var(--muted);font-size:.8rem;padding:0 0 40px;}
@media (prefers-reduced-motion: reduce){.toast{transition:none;}}
</style>
</head>

function renderFood(){
  var h='<div class="day-head"><div class="date">口袋名單</div><h2>大阪美食清單</h2></div><p class="leg-via">已排進行程的會標出哪一天；其他店先按「地圖」看位置，再挑順路的那天去。</p><ol class="line">';
  FOODS.forEach(function(f){
    h+='<li class="food"><div class="food-card"><span class="food-kind">'+(f.d?'已排進 <a href="#'+f.d+'">'+f.at+'</a>':'地點待確認')+'</span><div class="food-name">'+esc(f.n)+(f.jp?'<span class="food-jp">'+esc(f.jp)+'</span>':'')+'</div><p class="food-dish">'+esc(f.dish)+'</p><div class="btns"><a class="btn" href="'+gq(f.q)+'" target="_blank" rel="noopener">地圖</a><a class="btn" href="'+gi(f.q)+'" target="_blank" rel="noopener">照片</a><a class="btn" href="'+gs(f.n+' 食記')+'" target="_blank" rel="noopener">食記</a></div></div></li>';
  });
  return h+'</ol>';
}
var store={get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

function hotelCard(key,label){
  var h=H[key]; if(!h) return "";
  var addr=h.addr?'<div class="addr">'+esc(h.addr)+'</div>':'<div class="addr missing">地址待補，先用地圖搜尋飯店名稱</div>';
  return '<div class="hotel"><div class="lbl">'+(label||"今晚住宿")+(h.nights&&label?'　<span class="nights">'+h.nights+'</span>':'')+'</div><div class="name">'+esc(h.name)+'</div>'+addr+
    '<div class="btns"><a class="btn primary" href="'+gq(h.q)+'" target="_blank" rel="noopener">地圖</a>'+
    (h.addr?'<button class="btn" data-copy="'+esc(h.jp||h.addr)+'">複製地址</button>':'')+'</div></div>';
}

function renderDay(d){
  var i=DAYS.indexOf(d), html='<div class="day-head"><div class="date">'+d.md+'（'+d.wd+'）Day '+(i+1)+'</div><h2>'+esc(d.title)+'</h2>';
  if(d.links) html+='<div class="links">'+d.links.map(function(l){return '<a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+'</a>';}).join("")+'</div>';
  html+='</div>'+(d.hotel?hotelCard(d.hotel):'')+'<ol class="line">';
  d.items.forEach(function(it){
    if(it.s==="stop"){
      html+='<li class="stop '+(it.cls||"")+'">'+(it.t?'<span class="t">'+it.t+'</span>':'')+'<span class="n">'+esc(it.n)+'</span>'+(it.sub?'<span class="sub">'+esc(it.sub)+'</span>':'');
      var lk=[]; if(it.map) lk.push('<a href="'+it.map+'" target="_blank" rel="noopener">地圖</a>');
      if(it.p&&!it.map) lk.push('<a href="'+gq(it.p)+'" target="_blank" rel="noopener">地圖</a>');
      if(it.p) lk.push('<a href="'+gi(it.p)+'" target="_blank" rel="noopener">看照片</a>');
      if(it.links) it.links.forEach(function(l){lk.push('<a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+'</a>');});
      if(lk.length) html+='<span class="sub">'+lk.join("　")+'</span>';
      html+='</li>';
    } else if(it.s==="leg"){
      var m=MODES[it.m];
      html+='<li class="leg '+it.m+'" style="--m:var('+m[1]+')"><div class="leg-card"><span class="mode">'+m[0]+'</span><div class="leg-route">'+esc(it.r)+'</div>';
      if(it.via) html+='<div class="leg-via">'+esc(it.via)+'</div>';
      if(it.steps) html+='<ol class="steps">'+it.steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ol>';
      if(it.meta) html+='<div class="leg-meta">'+it.meta.map(function(x){return '<span>'+x[0]+' <b>'+esc(x[1])+'</b></span>';}).join("")+'</div>';
      if(it.warn) html+='<p class="warn">'+esc(it.warn)+'</p>';
      var b=[]; if(it.map) b.push('<a class="btn primary" href="'+it.map+'" target="_blank" rel="noopener">Google 地圖導航</a>');
      if(it.links) it.links.forEach(function(l){b.push('<a class="btn" href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+'</a>');});
      if(b.length) html+='<div class="btns">'+b.join("")+'</div>';
      html+='</div></li>';
    } else if(it.s==="food"){
      html+='<li class="food"><div class="food-card"><span class="food-kind">附近美食｜'+esc(it.k)+'</span><div class="food-name">'+esc(it.n)+(it.jp?'<span class="food-jp">'+esc(it.jp)+'</span>':'')+'</div><p class="food-dish">'+esc(it.dish)+'</p><p class="food-why">'+esc(it.why)+'</p><div class="btns"><a class="btn" href="'+gq(it.q)+'" target="_blank" rel="noopener">地圖</a><a class="btn" href="'+gi(it.q)+'" target="_blank" rel="noopener">照片</a><a class="btn" href="'+gs(it.n+' 食記')+'" target="_blank" rel="noopener">食記</a></div></div></li>';
    } else if(it.s==="todo"){
      var on=store.get("chk:"+it.k)==="1";
      html+='<li class="todo"><label class="check'+(it.hl?' hl':'')+'"><input type="checkbox" data-k="'+it.k+'"'+(on?' checked':'')+'><span>'+esc(it.tx)+(it.sub?'<em>'+esc(it.sub)+'</em>':'')+'</span></label></li>';
    }
  });
  html+='</ol>';
  html+='<div class="pager">'+(i>0?'<a class="btn" href="#'+DAYS[i-1].id+'">上一天 '+DAYS[i-1].md+'</a>':'<span></span>')+
        (i<DAYS.length-1?'<a class="btn" href="#'+DAYS[i+1].id+'">下一天 '+DAYS[i+1].md+'</a>':'<a class="btn" href="#stay">住宿總覽</a>')+'</div>';
  return html;
}
function renderStay(){
  return '<div class="day-head"><div class="date">三間住宿</div><h2>住宿總覽</h2></div><div class="stay-list">'+
    hotelCard("kyoto","京都")+hotelCard("bay","大阪灣")+hotelCard("honmachi","大阪本町")+'</div>';
}

function todayId(){
  var now=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  for(var i=0;i<DAYS.length;i++) if(DAYS[i].date===now) return DAYS[i].id;
  return null;
}
var TODAY=todayId();
function renderTabs(cur){
  var t=DAYS.map(function(d,i){return '<a href="#'+d.id+'"'+(d.id===cur?' aria-current="page"':'')+(d.id===TODAY?' class="is-today"':'')+'><b>D'+(i+1)+'</b><small>'+d.md+'</small></a>';}).join("");
  t+='<a href="#food"'+(cur==="food"?' aria-current="page"':'')+'><b>美食</b><small>清單</small></a>';
  t+='<a href="#stay"'+(cur==="stay"?' aria-current="page"':'')+'><b>住宿</b><small>地址</small></a>';
  var tabs=document.getElementById("tabs"); tabs.innerHTML=t;
  var a=tabs.querySelector('[aria-current]'); if(a) a.scrollIntoView({block:"nearest",inline:"center"});
}
function show(){
  var h=location.hash.replace("#",""), view=document.getElementById("view");
  var d=DAYS.filter(function(x){return x.id===h;})[0];
  if(h==="stay"){view.innerHTML=renderStay();}
  else if(h==="food"){view.innerHTML=renderFood();}
  else{ if(!d){d=DAYS.filter(function(x){return x.id===TODAY;})[0]||DAYS[0];} h=d.id; view.innerHTML=renderDay(d); }
  renderTabs(h); window.scrollTo(0,0);
}
document.getElementById("todayLbl").textContent=TODAY?"今天是 "+DAYS.filter(function(x){return x.id===TODAY;})[0].md:"11/3–11/11";
document.addEventListener("change",function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-k"); if(k) store.set("chk:"+k,e.target.checked?"1":"0");});
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1600);}
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("[data-copy]"); if(!b) return;
  var v=b.getAttribute("data-copy");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(function(){toast("已複製地址");},function(){toast(v);});}
  else toast(v);
});
window.addEventListener("hashchange",show);
show();
</script>
